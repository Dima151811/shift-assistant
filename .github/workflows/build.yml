name: Зібрати APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ShiftAssistant.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle assembleRelease --no-daemon
        working-directory: ShiftAssistant
      - uses: actions/upload-artifact@v4
        with:
          name: shift-assistant-apk
          path: ShiftAssistant/app/build/outputs/apk/release/*.apk
